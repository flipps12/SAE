name: Discord Branch Monitor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Discord
        run: |
          # Evitar enviar doble notificación si un PR cerrado no se mergeó
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "PR closed without merging. Skipping notification."
            exit 0
          fi

          # Construir el JSON para el webhook de Discord (Rich Embed)
          JSON_PAYLOAD=$(cat <<EOF
          {
            "username": "GitHub Monitor",
            "embeds": [
              {
                "title": "Alteración en rama 'main'",
                "color": 15418782, 
                "description": "**Evento:** ${{ github.event_name == 'push' && 'Push Directo / Merge' || 'Pull Request Merged' }}\n**Autor:** ${{ github.actor }}\n**Commit / PR:** [${{ github.sha }}](${{ github.event.repository.html_url }}/commit/${{ github.sha }})",
                "fields": [
                  {
                    "name": "Mensaje del Commit",
                    "value": "${{ github.event.head_commit.message || github.event.pull_request.title }}"
                  }
                ],
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
          )

          # Enviar la petición POST
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$JSON_PAYLOAD" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}