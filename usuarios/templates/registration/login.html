{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SAE26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">
    <link rel="stylesheet" href="{% static 'usuarios/css/responsive.css' %}">
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h2>SAE26</h2>
            <p>Sistema de Administración Educativa</p>
        </div>

        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="input-group-custom">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Usuario" required autocomplete="off">
            </div>

            <div class="input-group-custom">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span>Ingresar</span>
            </button>
        </form>

        <div class="register-link">
            ¿No tenés cuenta? <a href="#">Contactá al administrador</a>
        </div>
    </div>

    <script src="{% static 'usuarios/js/login.js' %}"></script>
</body>
</html>
